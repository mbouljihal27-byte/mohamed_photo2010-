<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOHAMED IA</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080808;color:white;
 font-family:Arial;text-align:center
}
header{padding:25px;border-bottom:1px solid gold}
h1{color:gold;font-size:32px}
main{max-width:700px;margin:35px auto;padding:20px}
textarea,input,select{
 width:100%;padding:15px;margin:12px 0;
 background:#181818;color:white;
 border:1px solid #555;border-radius:10px
}
button{
 padding:15px;border:0;border-radius:10px;
 background:gold;color:black;font-weight:bold;
 cursor:pointer
}
.generate{width:100%;font-size:18px}
#result{margin-top:25px}
img{max-width:100%;border-radius:15px}
a{color:gold}
</style>
</head>
<body>

<header>
<h1>MOHAMED IA ✨</h1>
<p>CREATE YOUR WORLD WITH AI</p>
</header>

<main>
<h2>🎨 إنشاء الصور بالذكاء الاصطناعي</h2>

<input id="key" type="password"
placeholder="API Key ديالك">

<textarea id="prompt"
placeholder="وصف الصورة اللي بغيتي..."></textarea>

<select id="style">
<option>Realistic</option>
<option>Anime</option>
<option>3D</option>
<option>Cinematic</option>
<option>Fantasy</option>
</select>

<button class="generate" onclick="generate()">
GENERATE ✨
</button>

<div id="result">
<p>الصورة ديالك غادي تبان هنا</p>
</div>
</main>

<script>
async function generate(){

const prompt=document.getElementById("prompt").value.trim();
const key=document.getElementById("key").value.trim();
const style=document.getElementById("style").value;
const result=document.getElementById("result");

if(!prompt){
 alert("كتب وصف الصورة أولا!");
 return;
}

if(!key){
 alert("خاصك API Key باش تولّد الصورة.");
 return;
}

result.innerHTML="<h3>⏳ كنصايبو الصورة...</h3>";

try{

const description=prompt+" style: "+style;

const response=await fetch(
"https://gen.pollinations.ai/image/"+
encodeURIComponent(description)+
"?model=black-forest-labs/flux.1-schnell",
{
headers:{
"Authorization":"Bearer "+key
}
});

if(!response.ok){
 throw new Error("Generation failed: "+response.status);
}

const blob=await response.blob();

if(!blob.type.startsWith("image/")){
 throw new Error("Response is not an image");
}

const url=URL.createObjectURL(blob);

result.innerHTML=`
<h3>✅ الصورة ديالك واجدة!</h3>
<img src="${url}" alt="AI Image">
<br><br>
<a href="${url}" download="mohamed-ia.png">
<button>📥 DOWNLOAD</button>
</a>
`;

}catch(error){
result.innerHTML=
"<p>وقع مشكل فالتوليد. تأكد من API Key وحاول مجدداً.</p>";
console.error(error);
}

}
</script>

</body>
</html>
