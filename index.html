```html
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOHAMED IA Calculator</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#080808;
 color:white;
 font-family:Arial;
 display:flex;
 justify-content:center;
 align-items:center;
 min-height:100vh;
}

.calculator{
 width:340px;
 padding:22px;
 background:#151515;
 border:1px solid #c99d32;
 border-radius:22px;
 box-shadow:0 0 25px #c99d3233;
}

h2{
 text-align:center;
 color:gold;
}

.display{
 background:#080808;
 border:1px solid #444;
 border-radius:12px;
 padding:20px;
 text-align:right;
 font-size:32px;
 min-height:85px;
 overflow-wrap:anywhere;
 margin-bottom:18px;
}

.buttons{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:9px;
}

button{
 padding:19px 5px;
 border:0;
 border-radius:10px;
 background:#292929;
 color:white;
 font-size:20px;
 cursor:pointer;
}

button:hover{
 background:#444;
}

.operator{
 background:#8d6b1e;
 color:white;
}

.clear{
 background:#b33b32;
}

.equal{
 background:#e0b43c;
 color:black;
}

footer{
 text-align:center;
 color:#999;
 font-size:12px;
 margin-top:20px;
}
</style>
</head>

<body>

<div class="calculator">

<h2>MOHAMED IA 🧮</h2>

<div class="display" id="display">0</div>

<div class="buttons">

<button class="clear" onclick="clearDisplay()">AC</button>
<button onclick="deleteLast()">⌫</button>
<button class="operator" onclick="percent()">%</button>
<button class="operator" onclick="add('/')">÷</button>

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button class="operator" onclick="add('*')">×</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button class="operator" onclick="add('-')">−</button>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button class="operator" onclick="add('+')">+</button>

<button onclick="add('0')">0</button>
<button onclick="add('00')">00</button>
<button onclick="add('.')">.</button>
<button class="equal" onclick="calculate()">=</button>

</div>

<footer>
MOHAMED IA © 2026
</footer>

</div>

<script>

let expression="";

const display=document.getElementById("display");

function show(){
 display.textContent=expression || "0";
}

function add(value){
 expression+=value;
 show();
}

function clearDisplay(){
 expression="";
 show();
}

function deleteLast(){
 expression=expression.slice(0,-1);
 show();
}

function percent(){
 expression+="%";
 show();
}

function calculate(){

 try{

 if(!expression) return;

 if(!/^[0-9+*/.%() -]+$/.test(expression))
 throw Error();

 let safeExpression=expression.replace(
 /(\d+(?:\.\d+)?)%/g,
 "($1/100)"
 );

 let result=Function(
 '"use strict"; return ('+safeExpression+')'
 )();

 if(!Number.isFinite(result))
 throw Error();

 expression=String(Number(result.toPrecision(12)));
 show();

 }catch(error){

 display.textContent="Erreur";
 expression="";

 }

}

</script>

</body>
</html>
