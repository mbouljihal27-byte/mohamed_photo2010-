<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON BLOCK</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d18;color:white;
 font-family:Arial;text-align:center;padding:20px
}
h1{color:#40e7ff;letter-spacing:5px}
#status{color:#ffd166;margin:15px}
#board{
 display:grid;grid-template-columns:repeat(9,1fr);
 gap:4px;width:min(92vw,480px);margin:auto;
}
.cell{
 aspect-ratio:1;background:#1a2940;
 border:1px solid #344b68;border-radius:5px;
 position:relative;cursor:pointer
}
.blue,.pink{
 position:absolute;inset:18%;border-radius:50%;
}
.blue{background:#40e7ff;box-shadow:0 0 12px #40e7ff}
.pink{background:#ff5ca8;box-shadow:0 0 12px #ff5ca8}
.wall{background:#ffd166!important}
button{
 padding:12px 20px;margin:7px;border:0;
 border-radius:9px;font-weight:bold;cursor:pointer
}
</style>
</head>
<body>

<h1>NEON BLOCK</h1>
<p id="status">BLUE PLAYER STARTS</p>

<div id="board"></div>

<p>
<button onclick="mode='move'">MOVE</button>
<button onclick="mode='wall'">WALL</button>
<button onclick="reset()">NEW GAME</button>
</p>

<script>
const N=9;
let players=[{r:0,c:4},{r:8,c:4}];
let walls=[];
let turn=0;
let mode='move';
let gameOver=false;

const board=document.getElementById("board");

function blocked(r,c,nr,nc){
 return walls.some(w=>{
  if(w.o==="h")
   return (r===w.r&&nr===w.r&&Math.min(c,nc)===w.c)
       ||(r===w.r+1&&nr===w.r+1&&Math.min(c,nc)===w.c);
  return (c===w.c&&nc===w.c&&Math.min(r,nr)===w.r)
      ||(c===w.c+1&&nc===w.c+1&&Math.min(r,nr)===w.r);
 });
}

function render(){
 board.innerHTML="";

 for(let r=0;r<N;r++){
  for(let c=0;c<N;c++){
   let cell=document.createElement("div");
   cell.className="cell";

   players.forEach((p,i)=>{
    if(p.r===r&&p.c===c){
     let dot=document.createElement("div");
     dot.className=i===0?"blue":"pink";
     cell.appendChild(dot);
    }
   });

   if(walls.some(w=>w.r===r&&w.c===c)){
    cell.classList.add("wall");
   }

   cell.onclick=()=>play(r,c);
   board.appendChild(cell);
  }
 }

 document.getElementById("status").textContent=
 gameOver?"🏆 GAME OVER":
 (turn===0?"🔵 BLUE PLAYER":"🔴 PINK PLAYER")+
 " — "+mode.toUpperCase();
}

function play(r,c){
 if(gameOver)return;

 let p=players[turn];

 if(mode==="move"){
  let distance=Math.abs(p.r-r)+Math.abs(p.c-c);

  if(distance!==1)return;
  if(players.some((x,i)=>i!==turn&&x.r===r&&x.c===c))return;
  if(blocked(p.r,p.c,r,c))return;

  p.r=r;p.c=c;

  if((turn===0&&r===8)||(turn===1&&r===0)){
   gameOver=true;
   render();
   document.getElementById("status").textContent=
    "🏆 "+(turn===0?"BLUE":"PINK")+" WINS!";
   return;
  }

  turn=1-turn;
 }

 else{
  if(r>7||c>7)return;
  if(walls.some(w=>w.r===r&&w.c===c))return;

  walls.push({r,c,o:"h"});
  turn=1-turn;
  mode="move";
 }

 render();
}

function reset(){
 players=[{r:0,c:4},{r:8,c:4}];
 walls=[];
 turn=0;
 mode="move";
 gameOver=false;
 render();
}

render();
</script>

</body>
</html>
