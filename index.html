```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON BLOCK</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b16;color:white;font-family:Arial;text-align:center}
h1{color:#00eaff;text-shadow:0 0 15px #00eaff}
button,input{padding:13px;margin:7px;border:0;border-radius:9px;font-weight:bold}
button{background:#00eaff;cursor:pointer}
input{background:#202b40;color:white}
.hidden{display:none}
.menu{margin-top:100px}
.board{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;width:min(90vw,450px);margin:20px auto}
.cell{aspect-ratio:1;background:#17243a;border-radius:5px;cursor:pointer}
.blue{background:#00d9ff!important;border-radius:50%}
.red{background:#ff287b!important;border-radius:50%}
.wall{background:#ffe600!important}
#status{color:#ffe600;margin:15px}
</style>
</head>
<body>

<div id="login" class="menu">
<h1>⚡ NEON BLOCK ⚡</h1>
<h2>WELCOME PLAYER</h2>
<input id="username" placeholder="Enter your name">
<br>
<button type="button" onclick="login()">JOIN GAME</button>
</div>

<div id="home" class="hidden menu">
<h1>NEON BLOCK</h1>
<h3 id="welcome"></h3>
<button onclick="start('offline')">📴 OFFLINE</button>
<button onclick="start('robot')">🤖 VS ROBOT</button>
<button onclick="start('online')">🌐 ONLINE</button>
</div>

<div id="game" class="hidden">
<h1>⚡ NEON BLOCK ⚡</h1>
<div id="status"></div>
<button onclick="mode='move'">MOVE</button>
<button onclick="mode='horizontal'">H WALL</button>
<button onclick="mode='vertical'">V WALL</button>
<div class="board" id="board"></div>
<button onclick="resetGame()">NEW GAME</button>
<button onclick="goHome()">HOME</button>
</div>

<script>
let name="";
let gameMode="";
let mode="move";
let turn=0;
let finished=false;
let walls=[];
let players=[];

function login(){
    let input=document.getElementById("username");
    name=input.value.trim();

    if(name===""){
        alert("Please enter your name!");
        return;
    }

    localStorage.setItem("neonPlayer",name);

    document.getElementById("login").style.display="none";
    document.getElementById("home").style.display="block";

    document.getElementById("welcome").innerText="Welcome "+name+"!";
}

function start(m){
 gameMode=m;
 document.getElementById("home").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");
 resetGame();

 if(m==="online"){
  alert("Online mode needs a server connection.");
 }
}

function resetGame(){
 players=[
 {r:8,c:4,color:"blue",goal:0},
 {r:0,c:4,color:"red",goal:8}
 ];
 walls=[];turn=0;finished=false;mode="move";
 draw();
}

function draw(){
 let b=document.getElementById("board");
 b.innerHTML="";
 for(let r=0;r<9;r++){
  for(let c=0;c<9;c++){
   let cell=document.createElement("div");
   cell.className="cell";
   players.forEach(p=>{
    if(p.r===r&&p.c===c)cell.classList.add(p.color);
   });
   if(walls.some(w=>w.r===r&&w.c===c))
    cell.classList.add("wall");
   cell.onclick=()=>clickCell(r,c);
   b.appendChild(cell);
  }
 }
 document.getElementById("status").textContent=
 finished?"GAME OVER":players[turn].color.toUpperCase()+" TURN";
}

function blocked(r1,c1,r2,c2){
 return walls.some(w=>{
  if(w.type==="horizontal")
   return r1!==r2&&Math.min(r1,r2)===w.r&&(c1===w.c||c1===w.c+1);
  return c1!==c2&&Math.min(c1,c2)===w.c&&(r1===w.r||r1===w.r+1);
 });
}

function clickCell(r,c){
 if(finished)return;
 let p=players[turn];

 if(mode==="move"){
  if(Math.abs(p.r-r)+Math.abs(p.c-c)!==1)return;
  if(blocked(p.r,p.c,r,c))return;
  if(players.some(x=>x.r===r&&x.c===c))return;
  p.r=r;p.c=c;
  if(p.r===p.goal){
   finished=true;
   alert(p.color.toUpperCase()+" WINS!");
  }
 }else{
  if(r>=8||c>=8)return;
  if(walls.some(w=>w.r===r&&w.c===c))return;
  walls.push({r,c,type:mode});
 }

 turn=1-turn;
 draw();

 if(gameMode==="robot"&&turn===1&&!finished){
  setTimeout(robotMove,400);
 }
}

function robotMove(){
 if(finished)return;
 let p=players[1];
 let options=[
 [p.r+1,p.c],[p.r-1,p.c],
 [p.r,p.c+1],[p.r,p.c-1]
 ];
 options=options.filter(([r,c])=>
  r>=0&&r<9&&c>=0&&c<9&&
  !blocked(p.r,p.c,r,c)&&
  !players.some(x=>x.r===r&&x.c===c)
 );
 if(!options.length)return;
 options.sort((a,b)=>Math.abs(a[0]-8)-Math.abs(b[0]-8));
 let [r,c]=options[0];
 p.r=r;p.c=c;
 if(p.r===8){
  finished=true;
  alert("ROBOT WINS!");
 }
 turn=0;
 draw();
}

function goHome(){
 document.getElementById("game").classList.add("hidden");
 document.getElementById("home").classList.remove("hidden");
}

window.addEventListener("load",()=>{
 let saved=localStorage.getItem("neonPlayer");
 if(saved){
  name=saved;
  document.getElementById("login").style.display="none";
  document.getElementById("home").classList.remove("hidden");
  document.getElementById("welcome").innerText="Welcome "+name+"!";
 }
});
</script>
</body>
</html>
