```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON BLOCK</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050510;color:white;
 font-family:Arial;text-align:center;
}
h1{
 color:#00ffff;text-shadow:0 0 15px cyan;
 letter-spacing:5px;
}
#game{
 display:block;margin:15px auto;
 background:#09091c;
 border:2px solid #00ffff;
 box-shadow:0 0 20px cyan;
 border-radius:12px;
 max-width:95vw;
}
button{
 background:#09091c;color:#00ffff;
 border:2px solid #00ffff;
 padding:13px 25px;border-radius:10px;
 margin:6px;font-weight:bold;
 cursor:pointer;
}
button:active{background:#00ffff;color:black}
#score{color:#ff00ff;font-size:22px}
</style>
</head>
<body>

<h1>NEON BLOCK</h1>
<p>SCORE: <span id="score">0</span></p>

<canvas id="game" width="360" height="520"></canvas>

<button onclick="start()">START / RESTART</button>
<br>
<button id="left">◀ LEFT</button>
<button id="right">RIGHT ▶</button>

<p>Use ARROW KEYS or A / D</p>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let player={x:160,y:455,w:40,h:40,speed:5};
let blocks=[];
let score=0;
let running=false;
let keys={};
let left=false,right=false;
let timer=0;

function start(){
 player.x=160;
 blocks=[];
 score=0;
 timer=0;
 running=true;
 document.getElementById("score").textContent=0;
 requestAnimationFrame(loop);
}

document.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
});
document.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

function control(id,side){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();
  side(true);
 });
 b.addEventListener("pointerup",()=>side(false));
 b.addEventListener("pointerleave",()=>side(false));
 b.addEventListener("pointercancel",()=>side(false));
}
control("left",v=>left=v);
control("right",v=>right=v);

function drawPlayer(){
 ctx.shadowBlur=20;
 ctx.shadowColor="#00ffff";
 ctx.fillStyle="#00ffff";
 ctx.fillRect(player.x,player.y,player.w,player.h);
 ctx.shadowBlur=0;
}

function loop(){
 if(!running)return;

 ctx.clearRect(0,0,360,520);

 if(keys["arrowleft"]||keys["a"]||left)
 player.x-=player.speed;

 if(keys["arrowright"]||keys["d"]||right)
 player.x+=player.speed;

 player.x=Math.max(0,Math.min(320,player.x));

 drawPlayer();

 timer++;

 if(timer%65===0){
  blocks.push({
   x:Math.random()*320,
   y:-35,
   w:35,h:35,
   speed:2+score/100
  });
 }

 blocks.forEach((b,i)=>{
  b.y+=b.speed;

  ctx.shadowBlur=15;
  ctx.shadowColor="#ff00ff";
  ctx.fillStyle="#ff00ff";
  ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.shadowBlur=0;

  if(
   player.x<b.x+b.w &&
   player.x+player.w>b.x &&
   player.y<b.y+b.h &&
   player.y+player.h>b.y
  ){
   running=false;
   alert("GAME OVER! SCORE: "+score);
  }

  if(b.y>520){
   blocks.splice(i,1);
   score+=10;
   document.getElementById("score").textContent=score;
  }
 });

 requestAnimationFrame(loop);
}

ctx.fillStyle="white";
ctx.font="20px Arial";
ctx.fillText("PRESS START",115,250);
</script>
</body>
</html>
