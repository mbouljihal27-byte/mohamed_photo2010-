<script>

const ctx=c.getContext("2d");
const T=40,W=20,H=12;

let player,exit,enemies,walls;
let level=1,score=0,running=false;

function start(){
 difficulty=Number(document.getElementById("difficulty").value);
 document.getElementById("menu").style.display="none";
 document.getElementById("game").style.display="block";
 level=1;
 running=true;
 enemySpeed=Math.max(180,900-difficulty*150);
 loadLevel();
 startEnemies();
}

function loadLevel(){
 player={x:1,y:1};
 walls=[];
 enemies=[];
 score=0;

 maps[level-1].forEach((row,y)=>{
  [...row].forEach((v,x)=>{
   if(v==="#")walls.push({x,y});
   if(v==="E")exit={x,y};
  });
 });

 let count=2+difficulty*2+level;
 for(let i=0;i<count;i++){
  let x=5+(i*3)%10;
  let y=2+(i*2)%7;
  if(!blocked(x,y))enemies.push({x,y,dir:1});
 }

 draw();
 updateInfo();
}

function blocked(x,y){
 return walls.some(w=>w.x===x&&w.y===y);
}

function updateInfo(){
 let names=["EASY","NORMAL","HARD","EXTREME","IMPOSSIBLE"];
 document.getElementById("info").textContent=
 names[difficulty]+" | LEVEL "+level+"/5";
}

function move(dx,dy){
 if(!running)return;
 let x=player.x+dx,y=player.y+dy;
 if(x<0||y<0||x>=W||y>=H||blocked(x,y))return;

 player.x=x;
 player.y=y;

 if(enemies.some(e=>e.x===x&&e.y===y)){
  gameOver();
  return;
 }

 if(x===exit.x&&y===exit.y){
  if(level===5){
   running=false;
   clearInterval(enemyTimer);
   alert("🏆 YOU WON!");
   back();
  }else{
   level++;
   alert("LEVEL "+level+"!");
   loadLevel();
  }
  return;
 }
 draw();
}

function draw(){
 ctx.clearRect(0,0,800,500);
 ctx.fillStyle="#315b3c";
 ctx.fillRect(0,0,800,500);

 walls.forEach(w=>{
  ctx.fillStyle="#242c39";
  ctx.fillRect(w.x*T,w.y*T,T,T);
  ctx.strokeStyle="#566477";
  ctx.strokeRect(w.x*T,w.y*T,T,T);
 });

 ctx.fillStyle="gold";
 ctx.fillRect(exit.x*T+5,exit.y*T+5,30,30);
 ctx.fillStyle="black";
 ctx.font="20px Arial";
 ctx.fillText("E",exit.x*T+13,exit.y*T+27);

 enemies.forEach(e=>{
  ctx.fillStyle="red";
  ctx.beginPath();
  ctx.arc(e.x*T+20,e.y*T+20,14,0,Math.PI*2);
  ctx.fill();
 });

 ctx.fillStyle="#00d9ff";
 ctx.beginPath();
 ctx.arc(player.x*T+20,player.y*T+20,15,0,Math.PI*2);
 ctx.fill();
}

function startEnemies(){
 clearInterval(enemyTimer);
 enemyTimer=setInterval(()=>{
  if(!running)return;

  enemies.forEach(e=>{
   let nx=e.x+e.dir;
   if(blocked(nx,e.y)||nx>=19||nx<=1)e.dir*=-1;
   else e.x=nx;
  });

  if(enemies.some(e=>e.x===player.x&&e.y===player.y)){
   gameOver();
   return;
  }
  draw();
 },enemySpeed);
}

function gameOver(){
 running=false;
 clearInterval(enemyTimer);
 alert("GAME OVER! TRY AGAIN");
}

function restart(){
 clearInterval(enemyTimer);
 running=true;
 level=1;
 loadLevel();
 startEnemies();
}

function back(){
 running=false;
 clearInterval(enemyTimer);
 document.getElementById("game").style.display="none";
 document.getElementById("menu").style.display="block";
}

 };
 if(d[e.key]){
  e.preventDefault();
  move(...d[e.key]);
 }
});
