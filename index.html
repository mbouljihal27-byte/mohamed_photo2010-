<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohamed Photo 20106</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: black;
  color: white;
  text-align: center;
}

.screen {
  display: none;
  min-height: 100vh;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.screen.active {
  display: flex;
}

h1 {
  font-size: 35px;
}

button {
  padding: 15px 35px;
  border: none;
  border-radius: 30px;
  background: white;
  color: black;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 20px;
}

button:hover {
  background: gold;
}

img {
  max-width: 85%;
  max-height: 350px;
  border-radius: 20px;
  margin: 15px;
}
</style>
</head>

<body>

<div class="screen active" id="one">
  <h1>WELCOME TO MY WORLD</h1>
  <h2>Welcome</h2>
  <p>Are you ready?</p>
  <button onclick="next('two')">CONTINUE</button>
</div>

<div class="screen" id="two">
  <h1>MOHAMED BOULJIHAL</h1>
  <img src="moi.jpg" alt="Mohamed">
  <audio id="music" src="5-star.m4a"></audio>
  <button onclick="playMusic()">PLAY MUSIC</button>
  <button onclick="next('three')">NEXT</button>
</div>

<div class="screen" id="three">
  <h1>SALE 🇲🇦</h1>
  <img src="sale.jpg" alt="Sale">
  <button onclick="next('four')">NEXT</button>
</div>

<div class="screen" id="four">
  <h1>LET'S PLAY</h1>
  <button onclick="startGame()">START</button>
</div>

<script>
window.next = function(id) {
  document.querySelectorAll('.screen').forEach(function(screen) {
    screen.classList.remove('active');
  });

  document.getElementById(id).classList.add('active');
};

window.playMusic = function() {
  document.getElementById('music').play();
};

window.startGame = function() {
  alert("Welcome to Mohamed Photo 20106!");
};
</script>

</body>
</html>
